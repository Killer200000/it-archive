<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Archive Admin | Управление архивом</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .copy-btn:active { transform: scale(0.95); }
    .fade-in { animation: fadeIn 0.3s ease both; }
    .slide-down { animation: slideDown 0.3s ease both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(16,185,129,0.3);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-6">
  <!-- Header -->
  <header class="glass sticky top-0 z-40 border-b border-zinc-800 bg-zinc-900/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded bg-zinc-800 flex items-center justify-center text-emerald-400 font-bold text-xs">IA</div>
        <span class="font-bold text-xl tracking-tighter">IT<span class="text-zinc-400">Archive</span> <span class="text-xs text-zinc-500 ml-1">Admin</span></span>
      </div>
      <a href="index.html" class="text-xs text-zinc-400 hover:text-emerald-400 underline underline-offset-2 transition">← На сайт</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- Toast уведомление -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden transform translate-y-20 transition-all duration-300">
      <div id="toast-content" class="glass px-4 py-3 rounded-xl shadow-lg flex items-center gap-3">
        <div id="toast-icon" class="w-6 h-6 flex items-center justify-center text-emerald-400"><i class="fas fa-check"></i></div>
        <div>
          <div class="font-medium text-sm" id="toast-title">Успех</div>
          <div class="text-xs text-zinc-400" id="toast-message">Запись добавлена</div>
        </div>
      </div>
    </div>

    <!-- Секция подключения -->
    <section id="connect-section" class="glass rounded-xl p-5 sm:p-6 fade-in">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold text-zinc-200 flex items-center gap-2">
          <i class="fas fa-plug text-cyan-400"></i> Подключение к GitHub
        </h2>
        <button onclick="app.toggleConnect()" class="text-xs text-emerald-400 hover:text-emerald-300" id="connect-toggle">
          <span id="connect-text">Свернуть</span> <i class="fas fa-chevron-up ml-1"></i>
        </button>
      </div>

      <div id="connect-body" class="space-y-3 slide-down">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-500 mb-1 font-medium">GitHub Token</label>
            <div class="relative">
              <input type="password" id="token" class="w-full pl-9 pr-10 py-2 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" placeholder="ghp_..." />
              <button type="button" onclick="app.togglePassword()" class="absolute right-2 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white" id="pass-btn">
                <i class="fas fa-eye"></i>
              </button>
              <i class="fas fa-key absolute left-3 top-1/2 -translate-y-1/2 text-zinc-600"></i>
            </div>
            <p class="text-[10px] text-zinc-500 mt-1">Personal Access Token (repo scope)</p>
          </div>
          <div class="sm:col-span-2">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs text-zinc-500 mb-1 font-medium">Owner</label>
                <input type="text" id="owner" value="Killer200000" class="w-full py-2 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 mono" />
              </div>
              <div>
                <label class="block text-xs text-zinc-500 mb-1 font-medium">Repo</label>
                <input type="text" id="repo" value="it-archive" class="w-full py-2 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 mono" />
              </div>
              <div>
                <label class="block text-xs text-zinc-500 mb-1 font-medium">Branch</label>
                <input type="text" id="branch" value="main" class="w-full py-2 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 mono" />
              </div>
            </div>
          </div>
        </div>
        <button onclick="app.saveConfig()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold py-2.5 rounded-lg shadow-[0_0_20px_rgba(16,185,129,0.2)] transition flex items-center justify-center gap-2">
          <i class="fas fa-save"></i> Сохранить в браузере
        </button>
      </div>
    </section>
    <!-- Форма добавления -->
    <section class="glass rounded-xl p-5 sm:p-6 fade-in">
      <h2 class="font-semibold text-zinc-200 mb-5 flex items-center gap-2">
        <i class="fas fa-plus-circle text-emerald-400"></i> Новая запись в архив
      </h2>

      <form id="item-form" class="space-y-4" onsubmit="app.addItem(event)">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-xs text-zinc-500 mb-1 font-medium">Категория <span class="text-zinc-700">*</span></label>
            <select id="category" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500" onchange="app.onCategoryChange()">
              <option value="windows">Windows</option>
              <option value="android">Android</option>
              <option value="software">Софт</option>
              <option value="games">Игры</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-zinc-500 mb-1 font-medium">Иконка</label>
            <input type="text" id="icon" value="🪟" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500" maxlength="2" />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs text-zinc-500 mb-1 font-medium">Название <span class="text-zinc-700">*</span></label>
            <input type="text" id="title" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500" placeholder="Windows 10 LTSC 21H2 x64" />
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs text-zinc-500 mb-1 font-medium">Подзаголовок / тип</label>
            <input type="text" id="subtitle" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500" placeholder="Официальный образ" />
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs text-zinc-500 mb-1 font-medium">Описание</label>
            <textarea id="description" rows="2" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500" placeholder="Краткое описание файла..."></textarea>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-zinc-500 mb-1 font-medium">Версия</label>
              <input type="text" id="version" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500" placeholder="1.0" />
            </div>
            <div>
              <label class="block text-xs text-zinc-500 mb-1 font-medium">Размер</label>
              <input type="text" id="size" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500" placeholder="4.77 GB" />
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-zinc-500 mb-1 font-medium">Бейдж</label>
              <input type="text" id="badge" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500" placeholder="ISO" />
            </div>
            <div>
              <label class="block text-xs text-zinc-500 mb-1 font-medium">Тип хэша</label>
              <select id="hashType" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500">
                <option value="SHA256">SHA256</option>
                <option value="MD5">MD5</option>
                <option value="none">Нет</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-zinc-500 mb-1 font-medium">Значение хэша</label>
              <input type="text" id="hash" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 mono text-xs" placeholder="длинный хэш..." />
            </div>
            <div class="flex items-end">
              <button type="button" id="btn-generate-id" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-3 py-2.5 rounded-lg transition flex items-center gap-2">
                <i class="fas fa-random"></i> ID
              </button>
            </div>
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs text-zinc-500 mb-1 font-medium">Ссылка на скачивание (Archive.org) <span class="text-zinc-700">*</span></label>
            <input type="url" id="downloadUrl" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 mono text-xs" placeholder="https://ia....us.archive.org/..." />
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs text-zinc-500 mb-1 font-medium">Ссылка на страницу Archive.org</label>
            <input type="url" id="archiveUrl" class="w-full py-2.5 bg-zinc-900 border border-zinc-700 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 mono text-xs" placeholder="https://archive.org/details/..." />
          </div>
        </div>

        <button type="submit" id="btn-submit" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold py-3 rounded-lg shadow-[0_0_20px_rgba(16,185,129,0.2)] transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <span id="btn-text">Опубликовать в архив</span>
          <div id="btn-spinner" class="spinner hidden"></div>
        </button>
      </form>
    </section>
    <!-- Последние записи -->
    <section class="glass rounded-xl p-5 sm:p-6 fade-in">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold text-zinc-200 flex items-center gap-2">
          <i class="fas fa-history text-cyan-400"></i> Последние записи в data.json
        </h2>
        <button onclick="app.refreshList()" class="text-xs text-emerald-400 hover:text-emerald-300 flex items-center gap-1">
          <i class="fas fa-sync"></i> Обновить
        </button>
      </div>

      <div id="list-empty" class="hidden text-center py-8 text-zinc-500">
        <i class="fas fa-inbox text-zinc-700 mb-2"></i>
        <p>Записи не найдены или нет доступа к репозиторию.</p>
      </div>

      <div id="list-container" class="space-y-2">
        <!-- заполняется JS -->
      </div>
    </section>

  </main>
  <script>
    function b64EncodeUtf8(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    function b64DecodeUtf8(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    const app = (() => {
      let config = { token: '', owner: 'Killer200000', repo: 'it-archive', branch: 'main' };

      const els = {
        token: document.getElementById('token'),
        owner: document.getElementById('owner'),
        repo: document.getElementById('repo'),
        branch: document.getElementById('branch'),
        connectBody: document.getElementById('connect-body'),
        connectToggle: document.getElementById('connect-toggle'),
        connectText: document.getElementById('connect-text'),
        passBtn: document.getElementById('pass-btn'),
        tokenInput: document.getElementById('token'),
        form: document.getElementById('item-form'),
        btnSubmit: document.getElementById('btn-submit'),
        btnText: document.getElementById('btn-text'),
        btnSpinner: document.getElementById('btn-spinner'),
        category: document.getElementById('category'),
        icon: document.getElementById('icon'),
        listContainer: document.getElementById('list-container'),
        listEmpty: document.getElementById('list-empty'),
        toast: document.getElementById('toast'),
        toastTitle: document.getElementById('toast-title'),
        toastMessage: document.getElementById('toast-message'),
        toastIcon: document.getElementById('toast-icon'),
      };

      const categoryIcons = { windows: '🪟', android: '🤖', software: '⚙️', games: '🎮' };

      function init() {
        loadConfig();
        applyConfigToInputs();
        refreshList();
      }

      function loadConfig() {
        try {
          const raw = localStorage.getItem('it-archive-admin-config');
          if (raw) config = { ...config, ...JSON.parse(raw) };
        } catch (e) { console.error(e); }
      }

      function saveConfigToLS() {
        localStorage.setItem('it-archive-admin-config', JSON.stringify(config));
      }

      function applyConfigToInputs() {
        els.tokenInput.value = config.token || '';
        els.owner.value = config.owner || 'Killer200000';
        els.repo.value = config.repo || 'it-archive';
        els.branch.value = config.branch || 'main';
      }

      function toggleConnect() {
        const hidden = els.connectBody.classList.toggle('hidden');
        els.connectText.textContent = hidden ? 'Развернуть' : 'Свернуть';
        els.connectToggle.querySelector('i').className = hidden ? 'fas fa-chevron-down ml-1' : 'fas fa-chevron-up ml-1';
        if (!hidden) els.connectBody.classList.add('slide-down');
      }

      function togglePassword() {
        const input = els.tokenInput;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        els.passBtn.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
      }

      function saveConfig() {
        config.token = els.tokenInput.value.trim();
        config.owner = els.owner.value.trim() || 'Killer200000';
        config.repo = els.repo.value.trim() || 'it-archive';
        config.branch = els.branch.value.trim() || 'main';
        saveConfigToLS();
        showToast('Настройки сохранены в браузере', '', 'success');
      }

      function onCategoryChange() {
        els.icon.value = categoryIcons[els.category.value] || '';
      }

      function showToast(title, message, type = 'success') {
        els.toastTitle.textContent = title;
        els.toastMessage.textContent = message;
        els.toastIcon.className = 'w-6 h-6 flex items-center justify-center ' + (type === 'success' ? 'text-emerald-400' : 'text-rose-400');
        els.toast.classList.remove('hidden');
        setTimeout(() => els.toast.classList.add('hidden'), 3000);
      }
      function apiUrl(path) {
        return `https://api.github.com/repos/${config.owner}/${config.repo}${path}?ref=${config.branch}`;
      }

      async function getHeaders() {
        return {
          'Accept': 'application/vnd.github+json',
          'Authorization': `Bearer ${config.token}`,
          'X-GitHub-Api-Version': '2022-11-28',
          'Content-Type': 'application/json'
        };
      }

      async function fetchFile() {
        const res = await fetch(apiUrl('/contents/data.json'), { headers: await getHeaders() });
        if (!res.ok) {
          const err = await res.text().catch(() => '');
          throw new Error(`GET data.json: ${res.status} ${err}`);
        }
        const data = await res.json();
        const content = b64DecodeUtf8(data.content);
        const json = JSON.parse(content);
        return { sha: data.sha, json };
      }

      async function putFile(newJson, message) {
        const encoded = b64EncodeUtf8(newJson);
        const res = await fetch(apiUrl('/contents/data.json'), {
          method: 'PUT',
          headers: await getHeaders(),
          body: JSON.stringify({ message, content: encoded, sha: currentSha, branch: config.branch })
        });
        if (!res.ok) {
          const err = await res.text().catch(() => '');
          throw new Error(`PUT data.json: ${res.status} ${err}`);
        }
        return await res.json();
      }

      let currentSha = null;
      async function refreshList() {
        els.listContainer.innerHTML = '';
        els.listEmpty.classList.add('hidden');
        if (!config.token) { els.listEmpty.classList.remove('hidden'); return; }

        try {
          const { sha, json } = await fetchFile();
          currentSha = sha;
          (json.items || []).slice(0, 10).forEach(item => {
            const el = document.createElement('div');
            el.className = 'flex items-center justify-between p-3 bg-zinc-900 border border-zinc-800 rounded-lg';
            el.innerHTML = `
              <div class="flex items-center gap-3">
                <span class="text-lg">${item.icon || '📦'}</span>
                <div>
                  <div class="text-sm font-semibold text-zinc-100">${escapeHtml(item.title)}</div>
                  <div class="text-xs text-zinc-500 mono">${item.id} · ${item.category}</div>
                </div>
              </div>
              <button onclick="app.deleteItem('${escapeAttr(item.id)}')" class="text-zinc-500 hover:text-rose-400 p-1">
                <i class="fas fa-trash"></i>
              </button>
            `;
            els.listContainer.appendChild(el);
          });
        } catch (err) {
          console.error(err);
          els.listEmpty.textContent = 'Ошибка загрузки: ' + err.message;
          els.listEmpty.classList.remove('hidden');
        }
      }

      async function addItem(e) {
        e.preventDefault();
        if (!config.token) { showToast('Ошибка', 'Сначала сохраните настройки подключения (Token)', 'error'); return; }

        const title = document.getElementById('title').value.trim();
        const downloadUrl = document.getElementById('downloadUrl').value.trim();
        if (!title || !downloadUrl) { showToast('Ошибка', 'Заполните Название и Ссылку на скачивание', 'error'); return; }

        setSubmitLoading(true);
        try {
          const { sha, json } = await fetchFile();
          currentSha = sha;

          const newItem = {
            id: document.getElementById('category').value + '-' + Date.now(),
            category: document.getElementById('category').value,
            title,
            subtitle: document.getElementById('subtitle').value.trim(),
            description: document.getElementById('description').value.trim(),
            version: document.getElementById('version').value.trim(),
            size: document.getElementById('size').value.trim(),
            format: 'ISO',
            badge: document.getElementById('badge').value.trim(),
            icon: document.getElementById('icon').value.trim(),
            hashType: document.getElementById('hashType').value,
            hash: document.getElementById('hash').value.trim(),
            downloadUrl,
            archiveUrl: document.getElementById('archiveUrl').value.trim(),
            dateAdded: new Date().toISOString().split('T')[0]
          };

          if (newItem.hashType === 'none') { delete newItem.hashType; delete newItem.hash; }

          json.items = json.items || [];
          json.items.push(newItem);

          await putFile(JSON.stringify(json, null, 2), `Add item: ${title}`);

          showToast('Опубликовано', `Запись "${title}" добавлена в архив`, 'success');
          document.getElementById('item-form').reset();
          els.icon.value = categoryIcons[document.getElementById('category').value] || '';
          await refreshList();
        } catch (err) {
          console.error(err);
          showToast('Ошибка API', err.message, 'error');
        } finally {
          setSubmitLoading(false);
        }
      }
      async function deleteItem(id) {
        if (!confirm('Удалить запись с ID: ' + id + '?')) return;
        try {
          const { sha, json } = await fetchFile();
          currentSha = sha;
          const before = json.items.length;
          json.items = (json.items || []).filter(item => item.id !== id);
          if (json.items.length === before) { showToast('Ошибка', 'Запись не найдена', 'error'); return; }

          await putFile(JSON.stringify(json, null, 2), `Delete item: ${id}`);
          showToast('Удалено', 'Запись удалена из архива', 'success');
          await refreshList();
        } catch (err) {
          console.error(err);
          showToast('Ошибка API', err.message, 'error');
        }
      }

      function setSubmitLoading(loading) {
        els.btnSubmit.disabled = loading;
        els.btnSpinner.classList.toggle('hidden', !loading);
        els.btnText.textContent = loading ? 'Идёт публикация…' : 'Опубликовать в архив';
      }

      function escapeHtml(text) {
        if (!text) return '';
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
      }

      function escapeAttr(text) {
        if (!text) return '';
        return String(text).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
      }

      return { init, toggleConnect, togglePassword, saveConfig, onCategoryChange, refreshList, addItem, deleteItem };
    })();

    document.getElementById('category').addEventListener('change', app.onCategoryChange);
    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
